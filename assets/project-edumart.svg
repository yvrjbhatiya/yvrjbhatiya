
<svg width="460" height="210" viewBox="0 0 460 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Midnight Blue Gradient -->
    <linearGradient id="eduGrad" x1="0" y1="0" x2="460" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B16" />
      <stop offset="55%" stop-color="#050A15" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Blue Glow -->
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>

    <!-- Purple Glow -->
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0" />
    </radialGradient>

    <!-- Dotted Texture -->
    <pattern id="eduDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E6EDF3" fill-opacity="0.07" />
    </pattern>

    <!-- Rounded Clip -->
    <clipPath id="eduClip">
      <rect width="460" height="210" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#eduClip)">

    <!-- Background -->
    <rect width="460" height="210" fill="url(#eduGrad)" />

    <!-- Dots -->
    <rect width="460" height="210" fill="url(#eduDots)" />

    <!-- Glows -->
    <circle cx="70" cy="20" r="170" fill="url(#glowA)" />
    <circle cx="440" cy="190" r="180" fill="url(#glowB)" />

    <!-- Project Title -->
    <circle cx="30" cy="38" r="6" fill="#58A6FF" />
    <text x="46" y="45" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">Edumart</text>
    <text x="430" y="43" text-anchor="end" fill="#58A6FF" font-family="Courier New, Courier, monospace" font-size="13" font-weight="bold">E-COMMERCE</text>

    <!-- Description -->
    <text x="26" y="80" fill="#9BA3AF" font-family="Arial, Helvetica, sans-serif" font-size="15">
      Full-stack e-commerce platform with email OTP
    </text>
    <text x="26" y="103" fill="#9BA3AF" font-family="Arial, Helvetica, sans-serif" font-size="15">
      verification and separate Vercel + Render deployment.
    </text>

    <!-- React -->
    <rect x="26" y="148" width="76" height="30" rx="15" fill="#161B22" fill-opacity="0.9" stroke="#58A6FF" stroke-width="1.5" />
    <text x="64" y="168" text-anchor="middle" fill="#58A6FF" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">React</text>

    <!-- Redux -->
    <rect x="110" y="148" width="76" height="30" rx="15" fill="#161B22" fill-opacity="0.9" stroke="#A371F7" stroke-width="1.5" />
    <text x="148" y="168" text-anchor="middle" fill="#A371F7" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">Redux</text>

    <!-- Node.js -->
    <rect x="194" y="148" width="86" height="30" rx="15" fill="#161B22" fill-opacity="0.9" stroke="#58A6FF" stroke-width="1.5" />
    <text x="237" y="168" text-anchor="middle" fill="#58A6FF" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">Node.js</text>

    <!-- MongoDB -->
    <rect x="288" y="148" width="94" height="30" rx="15" fill="#161B22" fill-opacity="0.9" stroke="#A371F7" stroke-width="1.5" />
    <text x="335" y="168" text-anchor="middle" fill="#A371F7" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">MongoDB</text>

  </g>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="458.5" height="208.5" rx="16" fill="none" stroke="#30363D" stroke-opacity="0.8" stroke-width="1.5" />
</svg>
