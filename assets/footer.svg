
<svg width="900" height="76" viewBox="0 0 900 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="900" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B16"/>
      <stop offset="55%" stop-color="#050A15"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <pattern id="footDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E6EDF3" fill-opacity="0.07"/>
    </pattern>

    <radialGradient id="blueGlow" cx="0" cy="0" r="1"
      gradientTransform="translate(760 10) rotate(135) scale(250 100)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="0" cy="0" r="1"
      gradientTransform="translate(100 80) rotate(-35) scale(220 100)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#A371F7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="900" y2="76"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#58A6FF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-900 0;0 0;900 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="170" y2="0"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="footClip">
      <rect width="900" height="76" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footClip)">
    <rect width="900" height="76" fill="url(#footBg)"/>
    <rect width="900" height="76" fill="url(#footDots)"/>
    <rect width="900" height="76" fill="url(#blueGlow)"/>
    <rect width="900" height="76" fill="url(#purpleGlow)"/>

    <!-- Floating glowing orbs -->
    <circle cx="650" cy="25" r="5" fill="#58A6FF" opacity="0.65">
      <animate attributeName="cy" values="25;48;25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="50" r="4" fill="#A371F7" opacity="0.7">
      <animate attributeName="cy" values="50;20;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;6;3" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="785" cy="24" r="3" fill="#79C0FF">
      <animate attributeName="cy" values="24;52;24" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated text accent -->
    <circle cx="22" cy="39" r="4" fill="#58A6FF">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <text x="36" y="43" fill="#9BA3AF"
      font-family="Arial, Helvetica, sans-serif" font-size="13.5">
      Open to Full-Stack Web Developer roles · Let’s build something useful.
    </text>

    <!-- Animated username glow -->
    <text x="864" y="43" text-anchor="end" fill="#79C0FF"
      font-family="Courier New, Courier, monospace" font-size="12.5">
      @yvrjbhatiya
      <animate attributeName="fill" values="#79C0FF;#C9A7FF;#79C0FF"
        dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated gradient border -->
  <rect x="0.75" y="0.75" width="898.5" height="74.5" rx="11.5"
    stroke="url(#borderGradient)" stroke-width="1.5"/>
</svg>

