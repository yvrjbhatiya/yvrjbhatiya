

<svg width="460" height="210" viewBox="0 0 460 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shpGrad" x1="0" y1="0" x2="460" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="55%" stop-color="#000000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <pattern id="shpDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E6EDF3" fill-opacity="0.07" />
    </pattern>

    <radialGradient id="shpBlueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(390 25) rotate(135) scale(190 130)">
      <stop stop-color="#58A6FF" stop-opacity="0.25" />
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="shpPurpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(40 205) rotate(-35) scale(180 110)">
      <stop stop-color="#A371F7" stop-opacity="0.22" />
      <stop offset="1" stop-color="#A371F7" stop-opacity="0" />
    </radialGradient>

    <clipPath id="shpClip">
      <rect width="460" height="210" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#shpClip)">
    <rect width="460" height="210" fill="url(#shpGrad)" />
    <rect width="460" height="210" fill="url(#shpDots)" />
    <rect width="460" height="210" fill="url(#shpBlueGlow)" />
    <rect width="460" height="210" fill="url(#shpPurpleGlow)" />
  </g>

  <rect width="460" height="210" rx="16" stroke="#303F60" stroke-width="1.5" />

  <circle cx="30" cy="38" r="6" fill="#A371F7" />
  <text x="46" y="45" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">Shop-See</text>
  <text x="430" y="43" text-anchor="end" fill="#A371F7" font-family="Courier New, Courier, monospace" font-size="13" font-weight="bold">STOREFRONT</text>

  <text x="26" y="80" fill="#9BA3AF" font-family="Arial, Helvetica, sans-serif" font-size="15">
    Responsive e-commerce storefront with product
  </text>
  <text x="26" y="103" fill="#9BA3AF" font-family="Arial, Helvetica, sans-serif" font-size="15">
    browsing, clean UI components, and cart state flows.
  </text>

  <rect x="26" y="148" width="76" height="30" rx="15" fill="#101B30" stroke="#58A6FF" stroke-width="1.5" />
  <text x="64" y="168" text-anchor="middle" fill="#79C0FF" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">React</text>

  <rect x="110" y="148" width="118" height="30" rx="15" fill="#101B30" stroke="#58A6FF" stroke-width="1.5" />
  <text x="169" y="168" text-anchor="middle" fill="#79C0FF" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">Material UI</text>

  <rect x="236" y="148" width="112" height="30" rx="15" fill="#17152E" stroke="#A371F7" stroke-width="1.5" />
  <text x="292" y="168" text-anchor="middle" fill="#C9A7FF" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">JavaScript</text>

  <rect x="356" y="148" width="70" height="30" rx="15" fill="#101B30" stroke="#79C0FF" stroke-width="1.5" />
  <text x="391" y="168" text-anchor="middle" fill="#79C0FF" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="bold">CSS3</text>
</svg>

