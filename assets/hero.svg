<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yuvraj Bhatiya, Full-Stack Developer, MERN Stack">
<title>Yuvraj Bhatiya, Full-Stack Developer | MERN Stack</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7D2FE"/></linearGradient>
  <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <radialGradient id="vA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="cA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="pA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F472B6" stop-opacity="0.16"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
  <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.15"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="360" rx="20"/></clipPath>
</defs>
<style>
  .rise { opacity: 0; animation: rise .8s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .spin { transform-origin: 950px 180px; animation: spin 24s linear infinite; }
  .spin2 { transform-origin: 950px 180px; animation: spin 14s linear infinite reverse; }
  .spin3 { transform-origin: 950px 180px; animation: spin 9s linear infinite; }
  .spin4 { transform-origin: 950px 180px; animation: spin 60s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="#05060A"/>
  <circle cx="1020" cy="30" r="340" fill="url(#vA)"/>
  <circle cx="120" cy="400" r="330" fill="url(#cA)"/>
  <circle cx="620" cy="390" r="300" fill="url(#pA)"/>

  <text class="rise" x="64" y="62" font-size="14" fill="#6B7280" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">~/yvrjbhatiya</text>
  <text class="rise" style="animation-delay:.1s" x="64" y="128" font-size="15" font-weight="600" letter-spacing="4" fill="url(#g)" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" textLength="440" lengthAdjust="spacing">FULL-STACK DEVELOPER · MERN STACK</text>
  <text class="rise" style="animation-delay:.2s" x="62" y="208" font-size="78" font-weight="700" letter-spacing="-2" fill="url(#nameG)" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" textLength="590" lengthAdjust="spacingAndGlyphs">Yuvraj Bhatiya</text>
  <rect class="rise" style="animation-delay:.3s" x="64" y="228" width="72" height="3" rx="1.5" fill="url(#g)"/>
  <text class="rise" style="animation-delay:.4s" x="64" y="266" font-size="19" fill="#9CA3AF" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">Web Design · Full-Stack Development · Responsive Design</text>


  <!-- orbital graphic -->
  <g opacity="0.95">
    <g class="spin4"><circle cx="950" cy="180" r="150" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 8"/></g>
    <circle cx="950" cy="180" r="120" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="950" cy="180" r="86" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="950" cy="180" r="52" fill="none" stroke="url(#g)" stroke-opacity="0.25" stroke-width="1.2"/>
    <g class="spin"><circle cx="1070" cy="180" r="6" fill="#22D3EE"/></g>
    <g class="spin2"><circle cx="950" cy="94" r="5" fill="#F472B6"/></g>
    <g class="spin3"><circle cx="998" cy="180" r="4" fill="#8B5CF6"/></g>
    <circle cx="950" cy="180" r="30" fill="url(#core)"/>
    <text x="950" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">&lt;/&gt;</text>
  </g>

  <g class="rise" style="animation-delay:.3s"><rect x="1018" y="34" width="142" height="30" rx="15" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.45"/><circle class="pulse" cx="1036" cy="49" r="4" fill="#34D399"/><text x="1050" y="54" font-size="13" fill="#D1FAE5" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">Open to work</text></g>
  <text x="1136" y="332" text-anchor="end" font-size="13" fill="#6B7280" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">Uttarakhand, India</text>
</g>
<rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="20" fill="none" stroke="url(#g)" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
